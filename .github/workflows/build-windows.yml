name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name UniversalMugenBot
          universal_mugen_bot.py

      - name: Package Windows ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/UniversalMugenBot.exe -DestinationPath dist/UniversalMugenBot-Windows.zip -Force

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/UniversalMugenBot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UniversalMugenBot.exe" | Set-Content -Encoding ascii dist/UniversalMugenBot.exe.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMugenBot-Windows-v0.1.1
          path: |
            dist/UniversalMugenBot.exe
            dist/UniversalMugenBot-Windows.zip
            dist/UniversalMugenBot.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release v0.1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.1"
          $assets = @(
            "dist/UniversalMugenBot.exe",
            "dist/UniversalMugenBot-Windows.zip",
            "dist/UniversalMugenBot.exe.sha256"
          )

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $assets `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Universal MUGEN Bot v0.1.1" `
              --notes "Correção da detecção: agora o bot encontra automaticamente o executável real dentro de subpastas como Game, evitando selecionar launchers pequenos na pasta-pai."
          }
